name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - run: npm run typecheck && npm test
      # Optional repository secrets allow all CI releases to share one private key.
      # Without them the CI artifact is signed with an ephemeral key for standalone installation.
      - name: Restore signing key when configured
        env:
          KEY_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            mkdir -p .keys
            printf '%s' "$KEY_BASE64" | base64 --decode > .keys/ci-release.jks
            echo "FOLIO_KEYSTORE=$PWD/.keys/ci-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build standalone APK and ZIP
        env:
          FOLIO_STORE_PASSWORD: ${{ secrets.FOLIO_STORE_PASSWORD }}
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
          FOLIO_KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
        run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOLIO-0.1-Android
          path: artifacts/FOLIO-0.1-Android.zip
          if-no-files-found: error
          retention-days: 90
