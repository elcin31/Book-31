name: Android APK
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: write
jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - run: npm run typecheck && npm test
      # Optional repository secrets allow all CI releases to share one private key.
      # Without them the CI artifact is signed with an ephemeral key for standalone installation.
      - name: Restore signing key when configured
        env:
          KEY_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            mkdir -p .keys
            printf '%s' "$KEY_BASE64" | base64 --decode > .keys/ci-release.jks
            echo "FOLIO_KEYSTORE=$PWD/.keys/ci-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build standalone APK and ZIP
        env:
          FOLIO_ARCHITECTURES: arm64-v8a,x86_64
          FOLIO_STORE_PASSWORD: ${{ secrets.FOLIO_STORE_PASSWORD }}
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
          FOLIO_KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
        run: npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOLIO-1.0-Android
          path: artifacts/FOLIO-1.0-Android.zip
          if-no-files-found: error
          retention-days: 90
      - name: Enable KVM for Android smoke test
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb install -r artifacts/package/FOLIO-1.0.apk
            python3 scripts/qa-android.py
      - name: Upload native launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FOLIO-Android-smoke-evidence
          path: artifacts/android-smoke/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish verified standalone distribution
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --target "$GITHUB_SHA" --title 'FOLIO 1.0 — Android' --notes-file artifacts/package/README.txt
          gh release upload v1.0.0 artifacts/FOLIO-1.0-Android.zip artifacts/package/signing-certificate.txt --clobber
